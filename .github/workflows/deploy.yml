name: Deploy to Integration Sandbox

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Auth to Salesforce (SFDX_AUTH_URL)
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > sfdx_auth_url.txt
          sf org login sfdx-url --sfdx-url-file sfdx_auth_url.txt --alias ci

      - name: Deploy metadata
        run: |
          sf project deploy start --manifest manifest/package.xml --target-org ci

      - name: Deploy AI components
        run: |
          sf project deploy start \
            -d force-app/main/default/classes/CreateAdoptionAgentforceService.cls \
            -d force-app/main/default/classes/CreateAdoptionAgentforceService.cls-meta.xml \
            -d force-app/main/default/classes/RejectAdoptionAgentforceService.cls \
            -d force-app/main/default/classes/RejectAdoptionAgentforceService.cls-meta.xml \
            -d force-app/main/default/genAiPromptTemplates/Adoption_Approved_Email.genAiPromptTemplate-meta.xml \
            -d force-app/main/default/genAiPromptTemplates/Generate_Animal_Description.genAiPromptTemplate-meta.xml \
            -d force-app/main/default/flows/Animal_Description_Generation.flow-meta.xml \
            -d force-app/main/default/flows/Adoption_Approved_Email_Flow.flow-meta.xml \
            --target-org ci
