<template>
    <lightning-card title="Shelters Dashboard">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
        <div class="search-container">
            <div class="search-input-col">
                <lightning-input
                    type="search"
                    label="Search shelters"
                    variant="label-hidden"
                    placeholder="Type shelter name..."
                    onchange={handleInputChange}>
                </lightning-input>
            </div>
            <div class="search-button-col">
                <lightning-button 
                    label="Search" 
                    variant="brand" 
                    onclick={handleSearch}>
                </lightning-button>
            </div>
        </div>
        <div class="container">
            <template for:each={shelters} for:item="s">
                <div key={s.Id} class="card">
                    <h2 class="title">{s.Name}</h2>
                    <div class="hours">
                        <p>Mon: {s.mon}</p>
                        <p>Tue: {s.tue}</p>
                        <p>Wed: {s.wed}</p>
                        <p>Thu: {s.thu}</p>
                        <p>Fri: {s.fri}</p>
                        <p>Sat: {s.sat}</p>
                        <p>Sun: {s.sun}</p>
                    </div>
                    <template if:true={s.Closed_From__c}>
                        <div class="closed">
                            Closed from {s.Closed_From__c} to {s.Closed_To__c}
                        </div>
                    </template>
                </div>
            </template>
        </div>
        
        <div slot="footer" class="pagination-footer">
            <lightning-button-group>
                <lightning-button 
                    label="Previous" 
                    icon-name="utility:chevronleft" 
                    onclick={handlePrevious} 
                    disabled={disablePrevious}>
                </lightning-button>
                <lightning-button 
                    label="Next" 
                    icon-name="utility:chevronright" 
                    icon-position="right" 
                    onclick={handleNext} 
                    disabled={disableNext}>
                </lightning-button>
            </lightning-button-group>
        </div>
    </lightning-card>
</template>
