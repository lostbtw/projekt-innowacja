<template>
    <lightning-card title="Shelters Dashboard">
        <div class="container">
            <template for:each={shelters} for:item="s">
                <div key={s.Id} class="card">
                    <h2 class="title">{s.Name}</h2>
                    <p class="sub">Shelter ID: {s.Id}</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
