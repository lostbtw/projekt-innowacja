<template>
    <lightning-card title="Missing Animals" icon-name="standard:search">
        <div class="slds-m-around_medium">

            <lightning-layout class="slds-m-bottom_medium">
                <lightning-layout-item size="12" small-device-size="8" medium-device-size="4" class="slds-p-right_small">
                    <lightning-input 
                        type="number" 
                        label="Days missing (dayDelta)" 
                        value={dayDelta} 
                        onchange={handleDayDeltaChange}
                        placeholder="e.g., 7">
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item class="button-wrapper">
                    <lightning-button 
                        label="Fetch" 
                        variant="brand" 
                        onclick={handleSearch}>
                    </lightning-button>
                </lightning-layout-item>
            </lightning-layout>

            <template if:true={isLoading}>
                <div class="slds-is-relative slds-p-around_large">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasSearched}>
                    <template if:true={animals.length}>
                        <div class="pets-grid">
                            <template for:each={animals} for:item="animal">
                                <c-animal-card 
                                    key={animal.id} 
                                    animal-name={animal.name}
                                    image-url={animal.imageUrl}
                                    is-clickable="false">
                                    
                                    <div slot="details">
                                        <div class="pet-details missing-id">
                                            <strong>ID:</strong> {animal.id}
                                        </div>
                                        <div class="pet-details">
                                            <strong>Missing Date:</strong> {animal.missingDate}
                                        </div>
                                    </div>
                                </c-animal-card>
                            </template>
                        </div>
                    </template>
                    <template if:false={animals.length}>
                        <div class="slds-illustration slds-illustration_small slds-m-top_large">
                            <div class="slds-text-longform">
                                <h3 class="slds-text-heading_small">No results</h3>
                                <p class="slds-text-body_regular">No missing animals found.</p>
                            </div>
                        </div>
                    </template>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
